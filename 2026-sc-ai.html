<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Scratch Advanced + AI Introduction — 16 Sessions</title>
    <link rel="icon"
        href="https://cdn-web-2.ruangguru.com/landing-pages/assets/e7d93748-818d-462d-be57-7db1e479cd62.png"
        type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #172554;
            --ink: #263559;
            --blue: #3b82f6;
            --orange: #f97316;
            --purple: #8b5cf6;
            --teal: #10b981;
            --muted: #5c6d89;
            --top: 69px;
            --bottom: 68px
        }

        * {
            box-sizing: border-box
        }

        html,
        body {
            margin: 0;
            height: 100%;
            width: 100%;
            overflow: hidden
        }

        body {
            font-family: Fredoka, 'Trebuchet MS', sans-serif;
            color: var(--ink);
            background: #f9fbff;
            -webkit-font-smoothing: antialiased
        }

        button,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        a {
            text-decoration: none
        }

        .topbar,
        .footbar {
            position: fixed;
            z-index: 15;
            left: 0;
            right: 0;
            height: var(--top);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 clamp(16px, 3vw, 42px);
            gap: 15px
        }

        .topbar {
            top: 0;
            box-shadow: 0 3px 16px #2436560b
        }

        .footbar {
            bottom: 0;
            height: var(--bottom);
            border-top: 1px solid #edf1fa
        }

        .brand-logos {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-shrink: 0
        }

        .brand-logos img {
            height: 36px;
            max-width: 166px;
            object-fit: contain
        }

        .brand-divider {
            height: 28px;
            width: 2px;
            background: #e6eaf4
        }

        .brand-fallback {
            font-size: 17px;
            font-weight: 700;
            color: #19438e
        }

        .brand-fallback.rg {
            color: #f97316
        }

        .course-tools {
            display: flex;
            align-items: center;
            gap: 20px
        }

        .course-name {
            font-size: 16px;
            color: #8490a7;
            font-weight: 600;
            white-space: nowrap
        }

        .course-name i {
            font-style: normal;
            color: var(--orange)
        }

        .select-wrap {
            position: relative
        }

        .session-select {
            height: 43px;
            width: min(355px, 36vw);
            border: none;
            border-radius: 13px;
            background: #f0f5ff;
            padding: 0 36px 0 13px;
            color: var(--navy);
            font-size: 16px;
            font-weight: 600;
            outline-offset: 3px;
            appearance: none
        }

        .select-arrow {
            position: absolute;
            right: 13px;
            top: 9px;
            color: #8794ab;
            pointer-events: none;
            font-size: 23px
        }

        .foot-label {
            display: block;
            font-size: 13px;
            color: #91a0b9;
            letter-spacing: .06em;
            font-weight: 600
        }

        .foot-title {
            display: block;
            max-width: 52vw;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 18px;
            color: var(--navy);
            font-weight: 700
        }

        .nav-controls {
            display: flex;
            align-items: center;
            gap: 13px
        }

        .nav-count {
            font-size: 20px;
            min-width: 89px;
            text-align: center;
            color: #506184;
            font-weight: 700
        }

        .navbtn {
            width: 46px;
            height: 46px;
            border: 2px solid #dfe6f3;
            border-radius: 50%;
            background: #fff;
            color: #54647f;
            font-size: 25px;
            display: grid;
            place-items: center;
            transition: transform .2s
        }

        .navbtn.next {
            border-color: var(--orange);
            background: var(--orange);
            color: white;
            box-shadow: 0 5px 12px #f973162d
        }

        .navbtn:disabled {
            opacity: .3;
            cursor: default
        }

        .navbtn:hover:not(:disabled) {
            transform: scale(1.07)
        }

        .workarea {
            position: fixed;
            inset: var(--top) 0 var(--bottom);
            padding: clamp(10px, 1.6vh, 17px) clamp(16px, 2.8vw, 45px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(ellipse at 8% 91%, #e9f4ff 0, transparent 33%), radial-gradient(ellipse at 95% 6%, #fff0e4 0, transparent 28%), radial-gradient(ellipse at 80% 88%, #f0ebff 0, transparent 27%), #fbfdff
        }

        .workarea:before,
        .workarea:after {
            content: '✦';
            position: absolute;
            font-size: 40px;
            color: #ffe0a7;
            pointer-events: none
        }

        .workarea:before {
            top: 11%;
            left: 4%
        }

        .workarea:after {
            right: 5%;
            bottom: 11%;
            font-size: 24px;
            color: #a6d5ff
        }

        #slideContent {
            height: 100%;
            width: 100%;
            max-width: 1320px;
            min-width: 0;
            position: relative;
            z-index: 1
        }

        .scene {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(11px, 2vh, 19px);
            min-height: 0;
            animation: scene-in .28s ease both
        }

        .scene-body {
            flex: 1 1 auto;
            min-height: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .scene-body>* {
            min-width: 0
        }

        @keyframes scene-in {
            from {
                opacity: .5;
                transform: translateY(7px)
            }

            to {
                opacity: 1;
                transform: translateY(0)
            }
        }

        .scene-head {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 7px;
            width: 100%
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #d4661b;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: .07em;
            text-transform: uppercase
        }

        .scene h1 {
            margin: 0;
            color: var(--navy);
            font-size: clamp(34px, 3.1vw, 46px);
            line-height: 1.11;
            font-weight: 700;
            letter-spacing: -.025em;
            text-align: center
        }

        .subtitle {
            max-width: 1030px;
            margin: 0;
            text-align: center;
            font-size: clamp(20px, 1.8vw, 25px);
            line-height: 1.29;
            font-weight: 500;
            color: var(--muted)
        }

        .emphasis {
            color: var(--orange)
        }

        .bubble {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 48% 52% 43% 57% / 55% 43% 57% 45%;
            background: #e6f2ff;
            overflow: visible
        }

        .bubble.purple {
            background: #f1ebff
        }

        .bubble.orange {
            background: #fff1dc
        }

        .bubble.teal {
            background: #e3f9f2
        }

        .sticker {
            position: absolute;
            z-index: 2;
            font-size: clamp(26px, 3vw, 46px);
            filter: drop-shadow(0 6px 6px #15244b16);
            animation: float 4s ease-in-out infinite
        }

        @keyframes float {
            50% {
                transform: translateY(-8px) rotate(6deg)
            }
        }

        .art {
            display: block;
            max-width: 100%;
            max-height: 100%;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 14px 11px #243e7317)
        }

        .art-frame {
            position: relative;
            width: 100%;
            height: 100%;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .art-frame .art {
            width: min(100%, 505px);
            height: min(100%, 375px)
        }

        /* COVER: full open page; color blobs and illustrations replace enclosing boxes. */
        .cover-scene {
            gap: 0
        }

        .cover-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1.08fr .92fr;
            gap: clamp(20px, 3vw, 50px);
            align-items: center
        }

        .cover-copy {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: clamp(12px, 2.3vh, 22px)
        }

        .cover-copy h1 {
            font-size: clamp(43px, 4.5vw, 64px);
            line-height: 1.05
        }

        .cover-copy .subtitle {
            font-size: clamp(23px, 2.12vw, 29px);
            line-height: 1.32
        }

        .session-label {
            font-size: 19px;
            font-weight: 700;
            color: #95a2b7
        }

        .cover-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 6px;
            flex-wrap: wrap;
            justify-content: center
        }

        .cover-actions span {
            padding: 10px 17px;
            border-radius: 999px;
            background: #e7f3ff;
            color: #2066ae;
            font-size: 19px;
            font-weight: 700
        }

        .cover-actions span:nth-child(2) {
            background: #f3ebff;
            color: #8253ca
        }

        .cover-actions span:nth-child(3) {
            background: #e4f8ee;
            color: #148463
        }

        .cover-art {
            position: relative;
            height: min(100%, 440px);
            display: flex;
            align-items: center;
            justify-content: center
        }

        .cover-art>.bubble {
            width: min(93%, 450px);
            height: 95%;
            min-height: 280px
        }

        .cover-art .sticker.one {
            top: 2%;
            right: 6%
        }

        .cover-art .sticker.two {
            bottom: 8%;
            left: 4%
        }

        /* AGENDA: floating icon islands, no cards or borders. */
        .agenda-path {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            align-items: center;
            gap: clamp(10px, 1.8vw, 24px);
            position: relative
        }

        .agenda-path:before {
            content: '';
            position: absolute;
            top: 37%;
            left: 7%;
            right: 7%;
            border-top: 4px dotted #c9dcf5
        }

        .agenda-item {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 17px;
            justify-content: center;
            min-height: 290px;
            text-align: center
        }

        .agenda-blob {
            width: clamp(110px, 12vw, 165px);
            height: clamp(110px, 12vw, 165px);
            border-radius: 46% 54% 53% 47% / 45% 44% 56% 55%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background: #e7f3ff;
            transform: rotate(-5deg)
        }

        .agenda-item:nth-child(2) .agenda-blob {
            background: #fff0df;
            transform: rotate(7deg)
        }

        .agenda-item:nth-child(3) .agenda-blob {
            background: #efe9ff;
            transform: rotate(-7deg)
        }

        .agenda-item:nth-child(4) .agenda-blob {
            background: #e1f9ee;
            transform: rotate(5deg)
        }

        .agenda-icon {
            font-size: clamp(58px, 6.3vw, 91px);
            line-height: 1
        }

        .agenda-num {
            position: absolute;
            top: -8px;
            right: -1px;
            background: #fff;
            color: var(--orange);
            font-size: 19px;
            font-weight: 700;
            width: 37px;
            height: 37px;
            display: grid;
            place-items: center;
            border-radius: 50%;
            box-shadow: 0 4px 15px #123e7033
        }

        .agenda-item strong {
            font-size: clamp(21px, 1.8vw, 27px);
            line-height: 1.29;
            max-width: 275px;
            min-height: 85px
        }

        /* Opening: illustrated space on one side + story typography on the other. */
        .story-layout {
            width: 100%;
            height: 100%;
            max-height: 450px;
            display: grid;
            grid-template-columns: .93fr 1.07fr;
            gap: 3%;
            align-items: center
        }

        .story-art {
            height: 100%;
            max-height: 420px;
            position: relative
        }

        .story-art .bubble {
            width: 100%;
            height: 96%
        }

        .story-art .sticker {
            right: 0;
            top: 5%
        }

        .story-copy {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 22px;
            text-align: center
        }

        .story-copy .story-text {
            font-size: clamp(24px, 2.15vw, 31px);
            font-weight: 600;
            line-height: 1.43;
            color: var(--navy)
        }

        .story-tip {
            font-size: clamp(20px, 1.65vw, 24px);
            background: #e8f3ff;
            color: #286caa;
            padding: 14px 24px;
            border-radius: 999px;
            font-weight: 700;
            max-width: 100%
        }

        /* FLOW: stepped illustrated tokens, NO rectangle around each step. */
        .concept-layout {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(22px, 4vh, 45px)
        }

        .flow-track {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: clamp(7px, 1.1vw, 15px)
        }

        .flow-step {
            flex: 1 1 0;
            min-width: 0;
            max-width: 244px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            gap: 12px
        }

        .flow-orb {
            width: clamp(93px, 9vw, 122px);
            height: clamp(93px, 9vw, 122px);
            border-radius: 48% 52% 52% 48% / 54% 46% 54% 46%;
            background: #e7f3ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(45px, 4.8vw, 66px);
            line-height: 1;
            transform: rotate(-6deg)
        }

        .flow-step:nth-child(3n) .flow-orb {
            background: #fff0df;
            transform: rotate(8deg)
        }

        .flow-step:nth-child(4n) .flow-orb {
            background: #eeeaff
        }

        .flow-step strong {
            font-size: clamp(19px, 1.8vw, 26px);
            line-height: 1.16;
            color: var(--navy)
        }

        .flow-arrow {
            font-size: clamp(24px, 3vw, 42px);
            font-weight: 700;
            color: #f0a059;
            flex: 0 0 auto;
            margin-top: -28px
        }

        .flow-plus {
            color: var(--purple);
            font-size: 34px;
            font-weight: 700;
            flex: 0 0 auto;
            margin-top: -28px
        }

        .idea-tip {
            display: flex;
            gap: 10px;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #fff0df;
            border-radius: 99px;
            padding: 15px 28px;
            font-size: clamp(20px, 1.65vw, 24px);
            font-weight: 600;
            color: #986022
        }

        /* Answers are interactive pill surfaces. Remaining educational content stays open. */
        .think-layout,
        .quiz-layout {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: clamp(16px, 3.4vh, 32px);
            text-align: center
        }

        .thought-mark {
            font-size: clamp(42px, 5.8vw, 76px);
            line-height: 1;
            filter: drop-shadow(0 8px 7px #162c5019)
        }

        .question {
            max-width: 1120px;
            color: var(--navy);
            font-size: clamp(28px, 2.5vw, 36px);
            font-weight: 700;
            line-height: 1.29;
            text-align: center
        }

        .answers {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            width: 100%;
            gap: 15px
        }

        .choice {
            min-height: 96px;
            width: 100%;
            padding: 15px;
            border: 2px solid transparent;
            background: #ecf4ff;
            border-radius: 23px;
            color: #214a80;
            font-size: clamp(21px, 1.8vw, 26px);
            line-height: 1.22;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: transform .2s, background .2s
        }

        .choice:nth-child(2) {
            background: #fff0e4;
            color: #ae5c23
        }

        .choice:nth-child(3) {
            background: #f1ecff;
            color: #7654bb
        }

        .choice:hover:not(:disabled) {
            transform: translateY(-5px);
            border-color: #a2bff0
        }

        .choice:disabled {
            cursor: default;
            opacity: 1
        }

        .choice.correct {
            background: #dcf9ea !important;
            color: #107345 !important;
            border-color: #30bd80 !important
        }

        .choice.incorrect {
            background: #ffe6e6 !important;
            color: #aa3131 !important;
            border-color: #efa5a5 !important
        }

        .answer-note {
            border-radius: 999px;
            padding: 11px 24px;
            color: #168055;
            background: #e5faee;
            font-weight: 700;
            font-size: 22px
        }

        .answer-note.try {
            color: #965415;
            background: #fff2df
        }

        /* Project: illustration, giant title, and four icon-based mini milestones, zero box grids. */
        .project-layout {
            display: grid;
            grid-template-columns: .9fr 1.1fr;
            gap: 3%;
            width: 100%;
            height: 100%;
            align-items: center
        }

        .project-show {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            justify-content: center;
            gap: 9px;
            height: 100%;
            min-height: 0
        }

        .project-show .art-frame {
            height: 58%;
            max-height: 250px
        }

        .project-show h2 {
            font-size: clamp(27px, 2.45vw, 36px);
            color: var(--orange);
            margin: 0;
            line-height: 1.12
        }

        .project-show p {
            font-size: clamp(20px, 1.7vw, 25px);
            line-height: 1.28;
            font-weight: 500;
            margin: 0
        }

        .project-milestones {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 23px 20px;
            align-items: center;
            justify-items: center
        }

        .project-point {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            gap: 8px
        }

        .project-point .point-emoji {
            font-size: clamp(40px, 4.7vw, 63px);
            width: 88px;
            height: 76px;
            display: grid;
            place-items: center;
            background: #f0f6ff;
            border-radius: 44% 56% 46% 54% / 45% 53% 47% 55%
        }

        .project-point:nth-child(2) .point-emoji {
            background: #fff2dd
        }

        .project-point:nth-child(3) .point-emoji {
            background: #f0eaff
        }

        .project-point:nth-child(4) .point-emoji {
            background: #e4f8ef
        }

        .project-point strong {
            font-size: clamp(19px, 1.65vw, 25px);
            line-height: 1.25;
            max-width: 300px
        }

        /* How it works: blue/orange/purple basic principles anchored by illustrations. */
        .how-layout {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            gap: clamp(23px, 4vh, 46px);
            width: 100%;
            height: 100%
        }

        .how-layout .flow-orb {
            width: clamp(78px, 7.2vw, 100px);
            height: clamp(78px, 7.2vw, 100px);
            font-size: 51px
        }

        .how-three {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 3%;
            text-align: center
        }

        .how-feature {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px
        }

        .how-feature .how-emoji {
            font-size: 52px
        }

        .how-feature h3 {
            font-size: clamp(24px, 2.1vw, 32px);
            margin: 0;
            color: var(--blue)
        }

        .how-feature:nth-child(2) h3 {
            color: var(--purple)
        }

        .how-feature:nth-child(3) h3 {
            color: var(--teal)
        }

        .how-feature p {
            font-size: clamp(19px, 1.6vw, 24px);
            line-height: 1.24;
            margin: 0
        }

        /* Sample: real embedded Scratch plus open side; no frame border around stage. */
        .sample-layout {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: 1.35fr .65fr;
            gap: 3%;
            align-items: center
        }

        .scratch-stage {
            height: min(100%, 445px);
            aspect-ratio: 4/3;
            max-width: 100%;
            margin: auto;
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 14px 36px #183b6c27
        }

        .scratch-stage iframe {
            display: block;
            height: 100%;
            width: 100%;
            border: 0
        }

        .sample-info {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            text-align: center;
            gap: 13px
        }

        .sample-info .sample-emoji {
            font-size: 70px
        }

        .sample-info h2 {
            font-size: clamp(27px, 2.6vw, 37px);
            margin: 0;
            color: var(--navy)
        }

        .sample-info p {

        function goToSlide(i) { if (i < 0 || i >= getSessionRenderers(sessions[currentSession - 1]).length) return; clearTimeout(pendingQuizTimer); pendingQuizTimer = null; currentSlide = i; if (i === getQuizSlideIndex()) { quizIndex = 0; quizScore = 0 } render() }
        function answerThink(btn) { const all = [...document.querySelectorAll('#thinkOptions .choice')]; if (all.some(x => x.disabled)) return; all.forEach(x => { x.disabled = true; if (x.dataset.correct === 'true') x.classList.add('correct') }); const right = btn.dataset.correct === 'true'; if (!right) btn.classList.add('incorrect'); const note = $('#thinkFeedback'); note.style.display = ''; note.className = `answer-note ${right ? '' : 'try'}`; note.textContent = right ? '✅ Benar! Kamu sudah paham!' : '💡 Belum tepat. Lihat jawaban hijau, yuk!' }
        function answerQuiz(btn) { const all = [...document.querySelectorAll('.quiz-layout .choice')]; if (all.some(x => x.disabled)) return; const right = btn.dataset.correct === 'true'; if (right) quizScore++; all.forEach(x => { x.disabled = true; if (x.dataset.correct === 'true') x.classList.add('correct') }); if (!right) btn.classList.add('incorrect'); const el = $('#quizStatus'); el.className = `quiz-status ${right ? 'good' : 'oops'}`; el.textContent = right ? '✅ Betul! Hebat!' : '💡 Belum tepat. Yang hijau jawaban benar!'; pendingQuizTimer = setTimeout(() => { quizIndex++; render(); pendingQuizTimer = null }, 1450) }
        function replayQuiz() { clearTimeout(pendingQuizTimer); pendingQuizTimer = null; quizIndex = 0; quizScore = 0; render() }
        function chooseFeeling(emoji, title) { $('#feelingContainer').innerHTML = `<div class="feeling-result"><span class="face">${emoji}</span><strong>${esc(title)}</strong><p>Makasih sudah memilih! Kalau masih bingung, boleh tanya ke guru, ya! 🌟</p></div>` }
        $('#meetingSelector').innerHTML = sessions.map(s => `<option value="${s.id}">Session ${s.id}: ${esc(s.title)}</option>`).join('');
        $('#meetingSelector').addEventListener('change', e => { currentSession = +e.target.value; goToSlide(0) });
        $('#prevBtn').addEventListener('click', () => goToSlide(currentSlide - 1)); $('#nextBtn').addEventListener('click', () => goToSlide(currentSlide + 1));
        document.addEventListener('keydown', e => { if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return; if (e.key === 'ArrowRight') goToSlide(currentSlide + 1); else if (e.key === 'ArrowLeft') goToSlide(currentSlide - 1) });
        render();
    </script>
</body>

</html>
